name: CI PIPELINE

on: 
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]
  
jobs: 
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres: 
        image: postgres:14.1-alpine
        env: 
          POSTGRES_USER: HoneyVanya
          POSTGRES_PASSWORD: 2kkckw63
          POSTGRES_DB: taskmanager_nest
        ports: 
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis: 
        image: redis:alpine
        ports: 
          - 6379:6379
    
    steps:
    - name: ⬇️ Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with: 
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: 💅 Linting Check
      run: npm run lint
      continue-on-error: true

    - name: 🏗️ Build Application
      run: npm run build

    - name: 🧪 Run Unit Tests
      env:
        DATABASE_URL: postgres://HoneyVanya:2kkckw63@localhost:5432/taskmanager_nest
        JWT_ACCESS_SECRET: test_secret 
        JWT_REFRESH_SECRET: test_refresh_secret
      run: |
        npx prisma migrate deploy
        npm run test

    - name: 🚀 Run E2E Tests
      env:
        DATABASE_URL: postgres://HoneyVanya:2kkckw63@localhost:5432/taskmanager_nest
        REDIS_URL: redis://localhost:6379
        JWT_ACCESS_SECRET: test_secret
        JWT_REFRESH_SECRET: test_refresh_secret
        GOOGLE_CLIENT_ID: mock_client
        GOOGLE_CLIENT_SECRET: mock_secret
        GOOGLE_CALLBACK_URL: http://localhost:3000/auth/callback
        FRONTEND_URL: http://localhost:5173
        PORT: 3000
      run: |
        npm run test:e2e
